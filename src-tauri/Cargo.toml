[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
axum = "0.8.9"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "process", "time", "test-util"] }
futures = "0.3.34"
uuid = { version = "1.28.0", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "query"] }
percent-encoding = "2.3.2"
bytes = "1.12.1"
lofty = "0.25.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
tauri-plugin-dialog = "2.8.3"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
